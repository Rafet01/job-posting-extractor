name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # the oldest version pyproject.toml allows
          cache: pip
      - run: pip install -r requirements.txt -e .
      - run: python -m pytest
